name: heron-review

# Advisory Heron review for kraftsman PRs.
#
# Heron's review primitive is repo-agnostic — a review carries the repo, PR and
# SHAs it is about, and Heron clones that repo itself and posts its findings
# back as a PR review. What is monorepo-shaped is the *trigger*, so this job is
# the fork's copy of exa-labs/monorepo's `heron-review` workflow:
#
#   1. check out the guardian rules and the review gate from exa-labs/monorepo
#      (rules are deliberately NOT vendored here — the monorepo stays the
#      single source of truth and this repo cannot drift from it);
#   2. authenticate to https://heron.exa.sh with the GitHub OIDC role
#      `github-actions-heron-review-kraftsman`
#      (terraform/global/aws_iam_roles.tf in the monorepo). The role holds no
#      AWS permissions: Heron authenticates a caller by fetching a presigned
#      `sts:GetCallerIdentity` URL and trusting the ARN AWS returns;
#   3. start one review per guardian whose globs match this PR's changed files,
#      poll to a verdict, and fail the job only on a blocking guardian's
#      rejection. In practice the catch-all global-review guardian (advisory)
#      is the one that matches Go changes here.
#
# SECURITY: this job holds OIDC credentials, so it must never execute untrusted
# PR-head code. It never checks this repository out at all — the gate reads the
# PR's changed-file list over the GitHub API and passes the SHAs to Heron as
# inert data — and the only code it runs is monorepo master.

on:
  pull_request:
    # No `branches:` filter: `pull_request.branches` matches the PR *base*
    # branch, which silently skips stacked PRs.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: heron-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The `secrets` context is unavailable in job-level `if:`, so the readonly-app
  # check runs as its own job and the review gates on its output. Fork PRs and a
  # repo that has not been granted the org secrets skip with an explanation
  # instead of failing every PR red.
  preflight:
    name: Heron review preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check monorepo read credentials
        id: check
        env:
          APP_ID: ${{ secrets.REPO_READONLY_GITHUB_APP_ID }}
          APP_KEY: ${{ secrets.REPO_READONLY_GITHUB_APP_KEY }}
        run: |
          if [ -n "${APP_ID}" ] && [ -n "${APP_KEY}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "enabled=false" >> "${GITHUB_OUTPUT}"
          {
            echo "### Heron review skipped"
            echo
            echo "\`REPO_READONLY_GITHUB_APP_ID\` / \`REPO_READONLY_GITHUB_APP_KEY\` are not available to"
            echo "this repository, so the guardian rules and review gate in exa-labs/monorepo cannot be"
            echo "checked out. Grant those org secrets to exa-labs/kraftsman to enable the review."
          } >> "${GITHUB_STEP_SUMMARY}"

  review:
    name: Heron review (advisory)
    needs: preflight
    if: ${{ needs.preflight.outputs.enabled == 'true' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    steps:
      - name: Mint a monorepo read token
        id: monorepo-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.REPO_READONLY_GITHUB_APP_ID }}
          private-key: ${{ secrets.REPO_READONLY_GITHUB_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: monorepo

      # Sparse cone checkout: the two packages the gate needs plus every
      # top-level file, which is where the `*_GUARDIAN.md` rule files live.
      - name: Check out the monorepo review gate and guardian rules
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: exa-labs/monorepo
          ref: master
          token: ${{ steps.monorepo-token.outputs.token }}
          path: monorepo
          sparse-checkout: |
            infra/heron/heron-review-gate
            infra/heron/heron-shared

      # pnpm 10+: the gate's `pnpm-workspace.yaml` carries only settings and no
      # `packages:` key, which pnpm 9 rejects with "packages field missing or
      # empty".
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.2.0
        with:
          version: 10.15.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6
        with:
          role-to-assume: arn:aws:iam::472386928882:role/github-actions-heron-review-kraftsman
          aws-region: us-west-2

      - name: Heron review
        working-directory: monorepo/infra/heron/heron-review-gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsx src/main.ts \
            --repo "${GITHUB_REPOSITORY}" \
            --pr "${{ github.event.pull_request.number }}" \
            --repo-root "${GITHUB_WORKSPACE}/monorepo"
